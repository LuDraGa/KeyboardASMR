chrome_web_store_listing:
  product_details:
    language: "English"

    title:
      value: "Keyboard ASMR"
      source: "package"

    summary:
      value: "Satisfy every keystroke — mechanical-keyboard clicks, typewriter tones & thocky ASMR that make typing addictive."
      source: "package"

    description: |-
      Bring your typing to life with satisfying, realistic typing sounds!
      Keyboard ASMR lets you pick from authentic mechanical keyboard switch sounds — from Holy Pandas and Banana Splits to Gateron Reds, MX Blues, and classic Typewriter clicks. Perfect for focus, flow, or just fun.

      I’ve added some of my favorite keyboard sound profiles and am looking for more — suggest yours on Discord if you’ve got great ASMR typing samples!

      💡 Profiles included
      a. Tactile classics: Holy Panda, Gateron Black Ink, Gateron Red Ink
      b. Clicky favorites: MX Blue, MX Brown, MX Speed Silver
      c. Soft & thocky: Banana Split, Telios V2, Alpaca
      d. Unique feels: Drum mode, iOS keyboard, Opera GX, Typewriter, New Typewriter

      🛠️ Features
      • Choose from preloaded mechanical keyboard, typewriter, and focus-sound profiles
      • Lightweight, smooth, and easy to use
      • Volume control, per-site mute option, and subtle white-noise-like ambience
      • Light and dark themes available
      • Manifest V3 compliant — built for performance and long-term support
      • Tap the Discord button in the header to jump straight into our feedback channel →
      https://discord.gg/2jcP6RBTPq

      🧠 Getting Started
      After install, hard-refresh any already-open tabs to activate the keyboard click sounds:
        • Windows: Ctrl + Shift + R
        • Mac: ⌘ + Shift + R

      🔒 Limitations
      a. Doesn’t run on restricted pages like the Chrome Web Store due to content-script rules
      b. Doesn’t work in the address bar/omnibox by design

      💬 Got ideas or found a bug?
      Join our Discord to share feedback, suggest new sound packs, vote on upcoming typing sound profiles, report issues, and preview builds.
      👉 https://discord.gg/2jcP6RBTPq

      6.1.0 Changelog
      - Key events added (Key down, Key up, Key pressed)
      - Only Key down events kept active

      6.1.1 Changelog
      FIX: double-sound issue resolved for certain browsers

