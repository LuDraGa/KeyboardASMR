name: "Drum Kit"
author: "KeyboardASMR Team"
description: "Turn your keyboard into a drum set with realistic hits and ghost notes"
version: "2.0"

ui:
  icon: "🥁"
  color: "linear-gradient(135deg, rgb(145, 209, 206) 0%, rgb(11, 129, 123) 100%)"
  category: "creative"

audio_sources:
  snare_hit:
    type: "bundled"
    path: "drum/snare1.wav"

  snare_ghost:
    type: "bundled"
    path: "drum/openSnare1.wav"

  kick_hit:
    type: "bundled"
    path: "drum/kick1.wav"

  tom_hit:
    type: "bundled"
    path: "drum/tom1.wav"

key_mappings:
  default:
    keydown: "snare_hit"
    keyup: null
    keypress: null

  "Enter":
    keydown: "kick_hit"
    keyup: null
    keypress: null

  "Backspace":
    keydown: "snare_ghost"
    keyup: null
    keypress: null

  " ":
    keydown: "tom_hit"
    keyup: null
    keypress: null