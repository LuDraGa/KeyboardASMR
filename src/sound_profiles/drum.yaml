name: "Drum Kit"
author: "KeyboardASMR Team"
description: "Turn your keyboard into a drum set"
version: "1.0"

ui:
  icon: "🥁"
  color: "linear-gradient(135deg, rgb(145, 209, 206) 0%, rgb(11, 129, 123) 100%)"
  category: "creative"

audio_sources:
  snare:
    type: "bundled"
    path: "drum/snare1.wav"

  kick:
    type: "bundled"
    path: "drum/kick1.wav"

  open_snare:
    type: "bundled"
    path: "drum/openSnare1.wav"

  tom:
    type: "bundled"
    path: "drum/tom1.wav"

key_mappings:
  default: "snare"
  "Enter": "kick"
  "Backspace": "open_snare"
  " ": "tom"