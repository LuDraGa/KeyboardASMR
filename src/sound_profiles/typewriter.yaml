name: "Typewriter"
author: "KeyboardASMR Team"
description: "Classic mechanical typewriter sounds with key press and release"
version: "2.0"

ui:
  icon: "⌨️"
  color: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)"
  category: "classic"

audio_sources:
  key_press_down:
    type: "bundled"
    path: "typewriter/key-press.wav"

  key_press_up:
    type: "bundled"
    path: "typewriter/key-press.wav"

  enter_key_down:
    type: "bundled"
    path: "typewriter/enter-key.wav"

  backspace_key_down:
    type: "bundled"
    path: "typewriter/backspace-tyr.wav"

key_mappings:
  default:
    keydown: "key_press_down"
    keyup: "key_press_up"

  "Enter":
    keydown: "enter_key_down"

  "Backspace":
    keydown: "backspace_key_down"